services:
  secrets-init:
    image: alpine:3.22
    command: >-
      /bin/sh -c "umask 077;
      if [ ! -s /run/portfolio-secrets/postgres_password ]; then
        head -c 48 /dev/urandom | base64 > /run/portfolio-secrets/postgres_password;
      fi;
      chmod 0444 /run/portfolio-secrets/postgres_password"
    volumes:
      - secrets_data:/run/portfolio-secrets
    restart: "no"

  # PostgreSQL база данных
  postgres:
    image: postgres:15
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      # Доступ к PostgreSQL из локальной сети. На хосте 5432 уже занят.
      - "5433:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD_FILE: /run/portfolio-secrets/postgres_password
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets_data:/run/portfolio-secrets:ro
      - ./portfolio_backup.dump:/docker-entrypoint-initdb.d/portfolio_backup.dump:ro
      - ./docker/postgres/10-restore-portfolio-backup.sh:/docker-entrypoint-initdb.d/10-restore-portfolio-backup.sh:ro
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  # Ваш Node.js сервер
  app:
    build: .
    container_name: portfolio-app
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./certs:/app/certs:ro
      - secrets_data:/run/portfolio-secrets:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Публичный адрес используется во всех ссылках в письмах и выгрузках.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Подключение к PostgreSQL — по имени сервиса "postgres" внутри Docker-сети,
      # а не "localhost". Именно эти переменные читает config.js.
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=portfolio
      - PG_USER=portfolio
      - PG_PASSWORD_FILE=/run/portfolio-secrets/postgres_password
      # AD выключен по умолчанию; при включении используется только корпоративный LDAPS.
      - AD_ENABLED=${AD_ENABLED:-false}
      - AD_URL=${AD_URL:-}
      - AD_DOMAIN=${AD_DOMAIN:-test.local}
      - AD_ADMIN_GROUP=${AD_ADMIN_GROUP:-HR_Managers}
      - AD_ALLOWED_GROUPS=${AD_ALLOWED_GROUPS:-HR_Managers}
      - AD_DEFAULT_ROLE=${AD_DEFAULT_ROLE:-leader}
      - AD_ALLOW_LOCAL_FALLBACK=${AD_ALLOW_LOCAL_FALLBACK:-false}
      - AD_TLS_REJECT_UNAUTHORIZED=${AD_TLS_REJECT_UNAUTHORIZED:-true}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TLS_CERT_PATH=${TLS_CERT_PATH:-}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-}
    user: node
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    shm_size: "1gb"
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - portfolio-network

volumes:
  postgres_data:
  secrets_data:

networks:
  portfolio-network:
    driver: bridge

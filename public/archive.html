<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Архив сотрудников — Портфолио IS1C</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/employee-table.css">
  <link rel="stylesheet" href="/vendor/uicons/regular/rounded.css">
  <style>
    .archive-main { padding:32px 0 56px; flex:1; }
    .archive-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap; }
    .archive-title { display:flex; align-items:center; gap:12px; font-size:1.55rem; font-weight:750; }
    .archive-title-icon { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; color:var(--accent-light); background:var(--accent-glow); border:1px solid var(--border-accent); }
    .archive-subtitle { color:var(--text-muted); font-size:.9rem; margin-top:7px; }
  </style>
</head>
<body class="page-wrapper archive-page">
<nav class="navbar">
  <div class="navbar-brand">
    <a href="/index.html" class="navbar-brand-link" aria-label="Вернуться на дашборд" title="На дашборд">
      <img src="/infosoft-dark.png" alt="ИнфоСофт" class="navbar-logo logo-dark" height="50">
      <img src="/infosoft-light.png" alt="ИнфоСофт" class="navbar-logo logo-light" height="60">
    </a>
  </div>
  <div class="navbar-actions">
    <button id="themeToggle" class="btn btn-ghost btn-sm" title="Сменить тему"><i class="fi fi-rr-moon"></i></button>
    <span id="navbarManager" style="font-size:.75rem;color:var(--text-muted);padding:0 4px;"></span>
    <button id="logoutBtn" class="btn btn-ghost btn-sm">Выйти</button>
  </div>
</nav>

<main class="archive-main container">
  <header class="archive-hero">
    <div>
      <h1 class="archive-title"><span class="archive-title-icon"><i class="fi fi-rr-users"></i></span> Архив сотрудников</h1>
      <p class="archive-subtitle">Здесь хранятся неактивные сотрудники. Их можно вернуть без потери данных.</p>
    </div>
    <a id="backToWork" href="/index.html" class="btn btn-ghost btn-sm"><i class="fi fi-rr-arrow-left"></i> К рабочему списку</a>
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="archiveSearch" class="form-control" type="search" placeholder="ФИО, должность, город, почта..." aria-label="Поиск в архиве сотрудников" style="width:340px">
      </div>
      <span class="search-result-count" id="employeeArchiveCount"></span>
    </div>
    <button id="restoreSelected" class="btn btn-primary btn-sm dashboard-action" type="button" disabled><i class="fi fi-rr-refresh"></i> Восстановить выбранных</button>
  </div>

  <div class="card employees-card">
    <div class="table-wrap">
      <table class="table" id="employeesTable" aria-live="polite">
        <thead>
          <tr>
            <th class="col-check" style="text-align:center;width:40px;"><input type="checkbox" id="selectAllArchived" aria-label="Выбрать всех сотрудников"></th>
            <th class="col-employee" style="text-align:left;">Сотрудник</th>
            <th class="col-role" style="text-align:left;">Должность</th>
            <th class="col-city" style="text-align:left;">Город</th>
            <th class="col-status" style="text-align:left;">Статус</th>
            <th class="col-link" style="text-align:center;">Ссылка</th>
            <th class="col-resume" style="text-align:center;">Резюме</th>
            <th class="col-actions" style="text-align:center;"></th>
          </tr>
        </thead>
        <tbody id="employeesTbody">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)"><span class="spinner"></span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div id="toastContainer" class="toast-container"></div>
<script src="/js/archive.js"></script>
<script src="/js/navbar.js"></script>
</body>
</html>

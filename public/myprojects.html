<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Мои проекты — Портфолио IS1C</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .main-content { padding: 32px 0; flex: 1; }
    .page-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .page-subtitle { color: var(--text-muted); font-size: 0.92rem; }
    .projects-list { display:grid; gap:16px; }
    .project-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }
    .project-head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 12px; }
    .team-row { display:grid; grid-template-columns: 1fr auto 40px; gap:10px; align-items:center; margin-bottom: 10px; }
    .team-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
    .checkbox-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:6px; }
    .checkbox-option { display:flex; align-items:flex-start; gap:6px; padding:6px 8px; border:1px solid var(--border); border-radius:7px; background:var(--bg-secondary); cursor:pointer; font-size:0.8rem; }
    .functional-blocks-panel { margin-top:10px; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,0.02); }
    .functional-blocks-panel > summary { cursor:pointer; padding:8px 10px; font-size:0.8rem; font-weight:600; color:var(--text-secondary); }
    .functional-blocks-panel-body { padding:0 10px 10px; }
  </style>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body class="page-wrapper">
<nav class="navbar">
  <div class="navbar-brand">
    <div class="navbar-brand-static">
      <img src="/infosoft-dark.png" alt="ИнфоСофт" class="navbar-logo logo-dark" height="50">
      <img src="/infosoft-light.png" alt="ИнфоСофт" class="navbar-logo logo-light" height="60">
    </div>
  </div>
  <div class="navbar-actions">
    <button id="themeToggle" class="btn btn-ghost btn-sm"><i class="fi fi-rr-moon"></i></button>
    <a href="#" id="backBtn" class="btn btn-ghost btn-sm">← Назад</a>
    <span id="navbarManager" style="font-size:0.75rem;color:var(--text-muted);padding:0 4px;"></span>
    <button id="logoutBtn" class="btn btn-ghost btn-sm hidden">Выйти</button>
  </div>
</nav>

<main class="main-content container">
  <div style="margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
    <div>
      <div class="page-title">Мои проекты</div>
      <div class="page-subtitle">Карточки проектов, за которые вы отвечаете.</div>
    </div>
    <button id="createProjectBtn" type="button" class="btn btn-primary btn-sm hidden"><i class="fi fi-rr-add"></i> Создать проект</button>
  </div>

  <div id="createProjectPanel" class="card hidden" style="margin-bottom:16px;">
    <div class="card-title" style="margin-bottom:12px;">Новый проект</div>
    <div class="form-group" style="margin-bottom:12px;">
      <label class="form-label" for="newProjectTitle">Название проекта</label>
      <input id="newProjectTitle" class="form-control" placeholder="Например: Внедрение 1С:ERP">
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;">
      <button id="cancelCreateProjectBtn" type="button" class="btn btn-ghost btn-sm">Отмена</button>
      <button id="saveNewProjectBtn" type="button" class="btn btn-primary btn-sm">Создать и заполнить</button>
    </div>
  </div>

  <div id="projectsList" class="projects-list"></div>
</main>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/myprojects.js"></script>
<script src="/js/navbar.js"></script>
</body>
</html>
